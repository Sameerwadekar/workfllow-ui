<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#a7f3d0" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f0fdf4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#047857" flood-opacity="0.35" />
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#shadow)" />

  <!-- Subtle Inner Ripple Wave / Flow Rings -->
  <circle cx="256" cy="245" r="170" fill="none" stroke="url(#ringGrad)" stroke-width="2" opacity="0.4" stroke-dasharray="8 8" />
  <circle cx="256" cy="245" r="140" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.25" />

  <!-- Flowing Alert Wave dynamic curves behind the bell -->
  <path d="M 120 280 C 170 210, 230 310, 300 240 C 340 200, 370 230, 400 220" fill="none" stroke="#34d399" stroke-width="6" stroke-linecap="round" opacity="0.6" />
  
  <!-- Flow Alert Icon Core: Modern Stylized Alert Bell with Flow Wave Motif -->
  <!-- Top Finial / Clapper Handle -->
  <circle cx="256" cy="142" r="15" fill="#ffffff" />
  
  <!-- Bell Body with sleek hydrodynamic curves -->
  <path d="M 256 165
           C 210 165, 185 200, 185 260
           C 185 295, 168 312, 155 324
           C 150 328, 154 336, 162 336
           L 350 336
           C 358 336, 362 328, 357 324
           C 344 312, 327 295, 327 260
           C 327 200, 302 165, 256 165 Z"
        fill="url(#bellGrad)"
        filter="url(#glow)" />

  <!-- Bell Clapper / Sonic Ping Accent -->
  <path d="M 226 352 C 228 372, 240 386, 256 386 C 272 386, 284 372, 286 352 Z" fill="#ffffff" opacity="0.95" />

  <!-- Flow Pulse Beacon (Active alert dot with ping aura) -->
  <circle cx="342" cy="180" r="22" fill="#10b981" stroke="#ffffff" stroke-width="5" />
  <circle cx="342" cy="180" r="10" fill="#ffffff" />
  <path d="M 338 180 L 341 183 L 347 177" fill="none" stroke="#059669" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
</svg>